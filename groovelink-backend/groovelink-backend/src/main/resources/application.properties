spring.application.name=groovelink-backend
server.port=${PORT:8080}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/groovelink}
spring.datasource.username=${DATABASE_USERNAME:groovelink}
spring.datasource.password=${DATABASE_PASSWORD:groovelink}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database=POSTGRESQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

app.seed.default-admin.enabled=${APP_SEED_ADMIN_ENABLED:true}
app.seed.demo.enabled=${APP_SEED_DEMO_ENABLED:false}
app.seed.default-admin.username=${APP_DEFAULT_ADMIN_USERNAME:admin}
app.seed.default-admin.email=${APP_DEFAULT_ADMIN_EMAIL:admin@example.com}
app.seed.default-admin.password=${APP_DEFAULT_ADMIN_PASSWORD:change-me}
app.seed.default-admin.cargo=${APP_DEFAULT_ADMIN_CARGO:SUPERADMIN}

# JWT Configuration
app.jwt.secret=${APP_JWT_SECRET:GrooveLink_SuperSecureKeyForHS512Algorithm_2026_RequiresMinimumOfSixtyFourBytesForSecurityCompliance_AddingMoreCharacters}
app.jwt.expiration=${APP_JWT_EXPIRATION:86400000}

# Almacenamiento de fotos (usar /tmp o volumen externo en producción)
app.fotos-evento.base-dir=${APP_FOTOS_BASE_DIR:/tmp/groovelink/fotos-evento}
app.fotos-perfil.base-dir=${APP_FOTOS_PERFIL_DIR:/tmp/groovelink/fotos-perfil}

# Multipart file upload limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Email (SMTP) - solo se activa si MAIL_HOST está configurado
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_TIMEOUT:5000}

# CORS - orígenes permitidos separados por coma
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
